<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="navbar(attiva)"
        th:with="autenticato=${utente != null or (authentication != null and authentication.name != 'anonymousUser')},
                 nomeAccount=${utente != null ? utente.username : (authentication != null ? authentication.name : 'Utente')}">
    <nav class="navbar" aria-label="Navigazione principale">
        <a class="logo" th:href="@{/}" href="/" aria-label="WeFit, homepage">We<span>Fit</span></a>
        <div class="nav-links">
            <a th:href="@{/}" href="/" th:classappend="${attiva == 'home' ? 'active' : ''}" th:attr="aria-current=${attiva == 'home' ? 'page' : null}">Home</a>
            <a th:href="@{/routines}" href="/routines" th:classappend="${attiva == 'routine' ? 'active' : ''}" th:attr="aria-current=${attiva == 'routine' ? 'page' : null}">Routine</a>
            <a th:href="@{/esercizi}" href="/esercizi" th:classappend="${attiva == 'esercizi' ? 'active' : ''}" th:attr="aria-current=${attiva == 'esercizi' ? 'page' : null}">Esercizi</a>
            <a th:href="${utente != null and utente.role == 'ADMIN'} ? @{/admin} : @{/area-personale}"
               th:text="${utente != null and utente.role == 'ADMIN'} ? 'Area admin' : 'Area personale'"
               th:classappend="${attiva == 'area' ? 'active' : ''}" th:attr="aria-current=${attiva == 'area' ? 'page' : null}">Area personale</a>
        </div>
        <form class="nav-search" th:action="@{/routines}" action="/routines" method="get" role="search">
            <label class="visually-hidden" for="routine-search-nav">Cerca una routine</label>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <input id="routine-search-nav" type="search" name="q" placeholder="Cerca una routine...">
        </form>
        <div class="account">
            <div class="auth-actions" th:if="${!autenticato}">
                <a class="button button-outline" th:href="@{/login}" href="/login">Accedi</a>
                <a class="button button-primary" th:href="@{/register}" href="/register">Registrati</a>
            </div>
            <details class="account-menu" th:if="${autenticato}">
                <summary><span th:text="${nomeAccount}">Utente</span></summary>
                <div class="account-dropdown">
                    <a class="private-account-link" th:href="${utente != null and utente.role == 'ADMIN'} ? @{/admin} : @{/area-personale}"
                       th:text="${utente != null and utente.role == 'ADMIN'} ? 'Area admin' : 'Area personale'">Area personale</a>
                    <form th:action="@{/logout}" action="/logout" method="post"><button type="submit">Esci</button></form>
                </div>
            </details>
        </div>
    </nav>
</header>
</body>
</html>
