<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrati | WeFit</title>

    <link rel="stylesheet" href="../static/css/home.css" th:href="@{/css/home.css}">
    <link rel="stylesheet" href="../static/css/accesso.css" th:href="@{/css/accesso.css}">
    <link rel="stylesheet" href="../static/css/studio.css" th:href="@{/css/studio.css}">
    <link rel="stylesheet" href="../static/css/pagine-interne.css" th:href="@{/css/pagine-interne.css}">
</head>

<body data-posa="corda" class="auth-body glass-form-page">

<header th:replace="~{fragments/navbar :: navbar('')}"></header>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-heading">
            <h1>Registrati</h1>
            <p>Crea il tuo account e inizia ad allenarti con WeFit.</p>
        </div>

        <form class="auth-form"
              th:action="@{/register}"
              method="post"
              th:object="${credenziali}">

            <!-- Errori generali inseriti tramite bindingResult.reject(...) -->
            <div class="form-message error" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="errore : ${#fields.globalErrors()}" th:text="${errore}"></p>
            </div>

            <div class="form-field">
                <label for="username">Nome utente</label>

                <input id="username"
                       type="text"
                       th:field="*{username}"
                       placeholder="Scegli un nome utente"
                       autocomplete="username"
                       required>

                <span class="field-error"
                      th:if="${#fields.hasErrors('username')}"
                      th:errors="*{username}">
                </span>
            </div>

            <div class="form-field">
                <label for="password">Password</label>

                <input id="password"
                       type="password"
                       th:field="*{password}"
                       placeholder="Scegli una password"
                       autocomplete="new-password"
                       required>

                <span class="field-error"
                      th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}">
                </span>
            </div>

            <button class="button button-primary auth-submit" type="submit">Registrati</button>

        </form>

        <p class="auth-switch">
            Hai già un account?
            <a href="/login" th:href="@{/login}">Accedi</a>
        </p>

    </section>

</main>

</body>
</html>
